<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arena Assistant</title>

  <style>

    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #02141d 0%, #000000 75%);
      font-family: Arial, sans-serif;
      color: white;
    }

    h1 {
      position: absolute;
      top: 25px;
      left: 30px;
      margin: 0;
      color: #00FFC2;
      font-size: 58px;
      z-index: 20;

      text-shadow:
        0 0 12px rgba(0,255,194,0.6),
        0 0 30px rgba(0,255,194,0.2);
    }

    .subtitle {
      position: absolute;
      top: 95px;
      left: 32px;
      font-size: 20px;
      color: rgba(255,255,255,0.7);
      z-index: 20;
    }

    .avatar-wrapper {
      position: fixed;

      top: 60%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: 100vw;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {

      height: 74vh;
      width: auto;

      object-fit: contain;

      filter:
        drop-shadow(0 0 30px rgba(0,255,194,0.12))
        drop-shadow(0 0 60px rgba(0,255,194,0.10));

      border-radius: 12px;
    }

    .ambient-glow {

      position: absolute;

      width: 700px;
      height: 700px;

      background:
        radial-gradient(circle,
        rgba(0,255,194,0.10) 0%,
        transparent 70%);

      filter: blur(60px);

      z-index: -1;
    }

  </style>
</head>

<body>

  <h1>Arena Assistant</h1>

  <div class="subtitle">
    Concierge digital · Arena Monterrey
  </div>

  <div class="avatar-wrapper">

    <div class="ambient-glow"></div>

    <video autoplay muted loop playsinline>

      <!-- IMPORTANTE:
           ESTE NOMBRE DEBE SER EXACTAMENTE IGUAL
           AL VIDEO EN GITHUB -->

      <source src="Arena%20Avatar%2024MB.mp4" type="video/mp4">

    </video>

  </div>

</body>

</html>
