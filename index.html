<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arena Assistant</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    video {
      position: fixed;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      height: 70vh;
      max-width: 95vw;
      object-fit: contain;
    }

    .brand {
      position: fixed;
      top: 25px;
      left: 30px;
      z-index: 10;
    }

    h1 {
      margin: 0;
      color: #00ffc2;
      font-size: 54px;
      text-shadow: 0 0 25px #00ffc2;
    }

    p {
      margin: 6px 0;
      color: #ddd;
    }

    .panel {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      width: min(900px, 92vw);
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #00ffc2;
      border-radius: 28px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 0 35px rgba(0,255,194,0.25);
    }

    #status {
      color: #00ffc2;
      font-weight: bold;
      margin-bottom: 10px;
    }

    #text {
      font-size: 21px;
      line-height: 1.4;
      min-height: 70px;
    }

    button {
      margin: 8px;
      padding: 15px 24px;
      border-radius: 999px;
      border: 0;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .main {
      background: #00ffc2;
      color: #00110d;
    }

    .recording {
      background: #ff3b5c;
      color: white;
      animation: pulse 1s infinite alternate;
    }

    .secondary {
      background: #222;
      color: white;
      border: 1px solid #555;
    }

    @keyframes pulse {
      from { box-shadow: 0 0 12px rgba(255,59,92,.35); }
      to { box-shadow: 0 0 45px rgba(255,59,92,.95); }
    }
  </style>
</head>

<body>

<div class="brand">
  <h1>Arena Assistant</h1>
  <p>Concierge digital · Arena Monterrey</p>
</div>

<video autoplay muted loop playsinline>
  <source src="https://robecardenasmty.github.io/arena-assistant-avatar/Arena%20Avatar%2024MB.mp4" type="video/mp4">
</video>

<div class="panel">
  <div id="status">Lista para ayudarte</div>
  <div id="text">Toca “Grabar pregunta”, habla y vuelve a tocar para enviar.</div>

  <button id="recordBtn" class="main" onclick="toggleRecording()">🎙️ Grabar pregunta</button>
  <button class="secondary" onclick="askAI('Hola')">Hola</button>
  <button class="secondary" onclick="askAI('¿Dónde están los baños?')">Baños</button>
  <button class="secondary" onclick="askAI('¿Dónde compro cerveza?')">Cerveza</button>
  <button class="secondary" onclick="askAI('Estoy en cancha')">Cancha</button>
</div>

<script>
const statusEl = document.getElementById("status");
const textEl = document.getElementById("text");
const recordBtn = document.getElementById("recordBtn");

let mediaRecorder;
let audioChunks = [];
let isRecording = false;

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

async function toggleRecording() {
  if (!isRecording) {
    await startRecording();
  } else {
    await stopRecording();
  }
}

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    audioChunks = [];

    mediaRecorder = new MediaRecorder(stream);

    mediaRecorder.ondataavailable = event => {
      if (event.data.size > 0) {
        audioChunks.push(event.data);
      }
    };

    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(track => track.stop());

      const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
      const audioBase64 = await blobToBase64(audioBlob);

      await askAI(null, audioBase64);
    };

    mediaRecorder.start();
    isRecording = true;

    recordBtn.textContent = "⏹️ Enviar pregunta";
    recordBtn.classList.add("recording");

    statusEl.textContent = "Escuchando...";
    textEl.textContent = "Habla ahora. Cuando termines, toca “Enviar pregunta”.";
  } catch (error) {
    statusEl.textContent = "No pude abrir el micrófono";
    textEl.textContent = "Revisa permisos del navegador o abre la página directamente en Safari/Chrome.";
  }
}

async function stopRecording() {
  if (!mediaRecorder || mediaRecorder.state !== "recording") return;

  isRecording = false;
  recordBtn.textContent = "🎙️ Grabar pregunta";
  recordBtn.classList.remove("recording");

  statusEl.textContent = "Procesando...";
  textEl.textContent = "Estoy procesando tu pregunta.";

  mediaRecorder.stop();
}

async function askAI(message, audioBase64 = null) {
  statusEl.textContent = "Pensando...";
  if (message) textEl.textContent = "Usuario: " + message;

  try {
    const res = await fetch("/.netlify/functions/ask", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message,
        audioBase64
      })
    });

    const data = await res.json();

    const reply = data.reply || "No pude procesar la respuesta.";

    statusEl.textContent = "Respondiendo...";
    textEl.textContent = reply;

    if (data.audioBase64) {
      const audio = new Audio("data:audio/mp3;base64," + data.audioBase64);
      await audio.play();
    }
  } catch (error) {
    statusEl.textContent = "Error";
    textEl.textContent = "No pude conectar con OpenAI. Revisa Netlify Functions y la API key.";
  }
}
</script>

</body>
</html>
